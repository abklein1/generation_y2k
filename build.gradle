plugins {
    id "com.github.spotbugs" version "6.0.7"
    id "checkstyle"
    id "application"
    id "jacoco"
}

application {
    mainClass = 'game.Main'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation fileTree(dir: 'lib', include: ['*.jar'])
}

// Offline one-shot tool: regenerate trimmed music-genre assets from the
// locally-downloaded MusicOSet dump under tools/musicgenre/data/.
// Not part of the game runtime. Usage: ./gradlew generateGenreAssets
tasks.register('generateGenreAssets', JavaExec) {
    group = 'tools'
    description = 'Generate trimmed artist/song genre assets from MusicOSet'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'utility.music.GenreAssetGenerator'
}

// Handle duplicates in distribution
distributions {
    main {
        contents {
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        }
    }
}

tasks.register('fatJar', Jar) {
    archiveFileName = 'SER316-Indvidual-Project-abklein1.jar'
    destinationDirectory = layout.projectDirectory.dir(
        'out/artifacts/SER316_Indvidual_Project_abklein1_jar')
    manifest {
        attributes 'Main-Class': 'game.Main'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.findAll { it.name.endsWith('jar') }
                .collect { zipTree(it) }
    }
    with tasks.jar
}

// Set Java version compatibility using toolchains
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// Compile sources as UTF-8 so non-ASCII string literals (e.g. accented
// artist names) are not corrupted by the platform default charset.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

///////////////////////////////////////////////////////////////////////
// Configure Checkstyle
///////////////////////////////////////////////////////////////////////
checkstyle {
    // Keep Checkstyle a little quieter
    ignoreFailures = true
    showViolations = false
    toolVersion = "10.12.5"  // Updated for Java 17 compatibility
}

tasks.withType(Checkstyle).configureEach {
    reports {
        html.required.set(true)
        xml.required.set(false)
    }
}

///////////////////////////////////////////////////////////////////////
// Configure SpotBugs
///////////////////////////////////////////////////////////////////////
// To generate an HTML report instead of XML
tasks.named("spotbugsMain") {
    reports {
        xml.required.set(false)
        html.required.set(true)
    }
}

spotbugs {
    toolVersion = '4.8.3'
    ignoreFailures = true
    showProgress = true
    effort = com.github.spotbugs.snom.Effort.valueOf('MAX')
    reportLevel = com.github.spotbugs.snom.Confidence.valueOf('LOW')
}